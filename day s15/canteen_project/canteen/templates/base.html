<!DOCTYPE html>
<html>
<head>
    <title>Canteen</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        /* Header style */
        .top-header {
            background-color: #f1f1f1; /* light gray */
            color: #007bff; /* bootstrap primary blue */
            font-weight: 700;
            font-size: 2rem;
            letter-spacing: 3px;
            text-align: center;
            padding: 12px 0;
            font-family: 'Arial Black', Arial, sans-serif;
            border-bottom: 2px solid #007bff;
        }

        /* Default body background */
        body {
            background-color: #ffffff; /* white */
            color: #000;
        }

        /* Light themed background and text colors ONLY on home page */
        body.home-page {
            background-color: #e9f0ff; /* very light blue */
            color: #004085; /* dark blue text */

            background-image: url('https://images.unsplash.com/photo-1525351484163-7529414344d8?auto=format&fit=crop&w=1470&q=80');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            position: relative;
        }

        /* Overlay to soften the background image for light theme */
        body.home-page::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255, 255, 255, 0.6); /* white with opacity */
            z-index: -1;
        }

        /* Navbar on home page: light background */
        body.home-page .navbar {
            background-color: #cce5ff !important; /* light blue */
        }

        /* Navbar links color on home page */
        body.home-page .nav-link,
        body.home-page .navbar-brand {
            color: #004085 !important; /* dark blue */
        }
    </style>
</head>
<body{% if request.path == '/' %} class="home-page"{% endif %}>
    <div class="top-header">
        MOTHER THERESA CANTEEN, PALAMANER
    </div>

    <nav class="navbar navbar-light bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">Home</a>
            <a class="nav-link" href="/products/">Menu</a>
            <a class="nav-link" href="/pay/">Pay</a>
            <a class="nav-link" href="/login/">Login</a>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
