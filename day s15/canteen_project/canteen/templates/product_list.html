{% extends 'base.html' %}
{% block content %}
<h3>Food Items</h3>
<div class="row">
    {% for product in products %}
    <div class="col-md-3">
        <div class="card mb-3">
            <img src="{{ product.image.url }}" class="card-img-top" height="150">
            <div class="card-body">
                <h5>{{ product.name }}</h5>
                <p>₹{{ product.price }}</p>
<a href="{% url 'add_to_cart' product.id %}" class="btn btn-sm btn-primary">Add to Cart</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
